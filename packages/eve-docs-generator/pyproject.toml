[project]
name = "eve-docs-generator"
version = "0.1.0"
description = "Generate minimal EVE docs data from the inspected MDX manifest"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=24.1.0,<25",
    "aiohttp>=3.12.15,<4",
    "python-dotenv>=1.0.1,<2",
    "msgpack>=1.1.1,<2",
]

[project.scripts]
eve-docs-generator = "eve_docs_generator.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
