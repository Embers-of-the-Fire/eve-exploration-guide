[project]
name = "eve-docs-generator"
version = "0.1.0"
description = "Generate minimal EVE docs data from the inspected MDX manifest"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["python-dotenv>=1.0.1,<2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
